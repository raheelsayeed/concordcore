[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "concordcore"
version = "1.0.0"
description = "A Python framework for evaluating Clinical Practice Guidelines (CPGs) against patient health data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Concord Health"}
]
keywords = ["cpg", "clinical-practice-guidelines", "healthcare", "fhir", "medical"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "annotated-types>=0.6.0",
    "certifi>=2024.2.2",
    "charset-normalizer>=3.3.2",
    "dnspython>=2.6.1",
    "email_validator>=2.1.1",
    "fhir.resources>=7.1.0",
    "fhirclient>=4.1.0",
    "idna>=3.6",
    "isodate>=0.6.1",
    "jinja-markdown>=1.210911",
    "Jinja2>=3.1.3",
    "Markdown>=3.5.2",
    "markdown-it-py>=3.0.0",
    "MarkupSafe>=2.1.5",
    "mdurl>=0.1.2",
    "pydantic>=2.6.3",
    "pydantic_core>=2.16.3",
    "Pygments>=2.17.2",
    "pymdown-extensions>=10.7.1",
    "PyYAML>=6.0.1",
    "requests>=2.31.0",
    "rich>=13.7.1",
    "simpleeval>=0.9.13",
    "six>=1.16.0",
    "typing_extensions>=4.10.0",
    "urllib3>=2.2.1",
    "humanize>=4.10.0",
]

[project.optional-dependencies]
ai = [
    "anthropic>=0.18.0",
    "openai>=1.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
    "black>=24.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "myst-parser>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/concordhealth/concordcore"
Documentation = "https://github.com/concordhealth/concordcore#readme"
Repository = "https://github.com/concordhealth/concordcore"
Issues = "https://github.com/concordhealth/concordcore/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (slower, may require external resources)",
    "fhir: Tests involving FHIR data parsing",
    "slow: Slow running tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["concordcore"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "tests/",
    "docs/",
]

[tool.ruff]
target-version = "py310"
line-length = 120
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.isort]
known-first-party = ["concordcore"]

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hatch
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.hatch.build.targets.wheel]
packages = ["src/concordcore"]
