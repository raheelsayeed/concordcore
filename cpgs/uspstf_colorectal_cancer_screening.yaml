    title: Reducing Your Colorectal Cancer Risk
    description: Lifestyle modifications to reduce risk
    expression: $age_45_to_49 is True or $age_50_to_75 is True or $age_76_to_85 is True
    narrative:
      patient:
        True: |
          ## How to Reduce Your Colorectal Cancer Risk

          In addition to screening, you can take steps to lower your risk:

          **Diet**
          - Eat plenty of vegetables, fruits, and whole grains
          - Limit red meat (beef, pork, lamb)
          - Avoid processed meats (hot dogs, bacon, deli meats)
          - Get enough fiber and calcium

          **Lifestyle**
          - Maintain a healthy weight
          - Be physically active (at least 150 minutes per week)
          - Don't smoke
          - Limit alcohol (no more than 1-2 drinks per day)

          **Medications** (discuss with your doctor)
          - Aspirin may reduce risk in some people
          - Talk to your doctor before starting any medication for prevention

          **Know Your Family History**
          - If close relatives had colorectal cancer or polyps, you may need earlier or more frequent screening
