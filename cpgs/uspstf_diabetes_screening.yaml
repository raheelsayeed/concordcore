  - id: display_understanding_diabetes
    category: display_patient
    title: Understanding Diabetes and Prediabetes
    description: Educational content about diabetes
    expression: $age_18_or_older is True
    narrative:
      patient:
        True: |
          ## Understanding Prediabetes and Type 2 Diabetes

          **What is prediabetes?**
          Prediabetes means your blood sugar levels are higher than normal but not high enough
          to be diagnosed as diabetes. About 1 in 3 US adults have prediabetes, and most don't know it.

          **What is type 2 diabetes?**
          Type 2 diabetes is a chronic condition where your body doesn't use insulin properly,
          leading to high blood sugar. It can cause serious health problems including:
          - Heart disease and stroke
          - Kidney disease
          - Vision problems
          - Nerve damage

          **Diagnostic Thresholds:**

          | Test | Normal | Prediabetes | Diabetes |
          |------|--------|-------------|----------|
          | Fasting Glucose | <100 mg/dL | 100-125 mg/dL | >=126 mg/dL |
          | HbA1c | <5.7% | 5.7-6.4% | >=6.5% |

          **Risk Factors:**
          - Overweight or obesity (BMI >=25)
          - Age 35 or older
          - Family history of diabetes
          - Physical inactivity
          - History of gestational diabetes
          - Certain racial/ethnic groups

  - id: display_prevention_tips
    category: display_patient
    title: Tips for Diabetes Prevention
    description: Actionable prevention advice
    expression: $age_18_or_older is True
    narrative:
      patient:
        True: |
          ## How to Lower Your Diabetes Risk

          Even small changes can make a big difference in preventing type 2 diabetes:

          **1. Move More**
          - Aim for 150 minutes of moderate activity per week (like brisk walking)
          - Break up sitting time - stand or walk every 30 minutes
          - Find activities you enjoy to stay consistent

          **2. Eat Well**
          - Choose whole grains over refined carbohydrates
          - Fill half your plate with vegetables
          - Limit sugary drinks and processed foods
          - Watch portion sizes

          **3. Manage Your Weight**
          - Losing just 5-7% of body weight significantly reduces diabetes risk
          - For a 200 lb person, that's only 10-14 pounds

          **4. Get Quality Sleep**
          - Aim for 7-9 hours per night
          - Poor sleep can affect blood sugar control

          **5. Manage Stress**
          - Chronic stress can raise blood sugar levels
          - Practice relaxation techniques
