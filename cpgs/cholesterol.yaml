          Your ten-year risk score ($ascvd_ten_year_risk_score) is intermediate (≥7.5% to <20%).
          You also have risk-enhancing factors ($ascvd_risk_enhancing_factors) that favor initiation or intensification of statin therapy.
      provider:
        True: |
          Patient's 10-year ASCVD risk is intermediate ($ascvd_ten_year_risk_score%).
          Risk-enhancing factors present: $ascvd_risk_enhancing_factors factor(s).
          Per 2019 ACC/AHA: Risk-enhancing factors favor initiation or intensification of statin therapy (Class IIa, LOE B-R).
    citations:
      - 'In intermediate-risk (≥7.5% to <20% 10-year ASCVD risk) adults, risk-enhancing factors favor initiation or intensification of statin therapy. (2019 ACC/AHA, Class IIa, LOE B-R)'
    class_of_recommendation: IIa
    level_of_evidence: B-R


  - id: based_on_highrisk
    title: High risk - High-intensity statin recommended
    expression: $high_risk is True and $has_diabetes is False
    category: medication
    narrative:
      patient:
        True: |
          Your ten-year risk score ($ascvd_ten_year_risk_score) is in the high-risk category (≥20%).
          High-intensity statin therapy is recommended to reduce LDL-C by 50% or more.
        False: Not applicable
      provider:
