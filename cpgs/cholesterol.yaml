recommendations:

  - id: based_on_high_ldl
    title: Risk reduction for high LDL-cholesterol (190 mg/dL or more)
    category: medication
    description: LDL-cholesterol ≥190 mg/dL enhances the risk of developing a heart attack, stroke or other cardiovascular event.
    expression: $ldl_over_190 is True
    compliance_expression: $med_statins is True
    narrative:
      compliance:
        patient:
          True: You are taking a medication
          False: You are not taking the medication
        provider: 
          True:  Patient is on a statin medication 
          False: This patient is __not__ on a statin medication
      patient:
        True: |
          
          Your most recent LDL is __$LDL__ mg/dL, recorded $LDL.date.

          People similar to you, with your age ($Age years) and an elevated LDL-cholesterol of over 190 mg/dL, __have benefited__ from a statin medication to prevent development of cardiovascular events like heart attack, stroke.
        False: LDL-cholesterol is less than 190 mg/dL 
      provider:
        True: |

          LDL-C: $LDL ($LDL.date)

          In patients 20 to 75 years of age with an __LDL-C level of 190 mg/dL__ (&ge;4.9 mmol/L) or higher, maximally tolerated statin therapy is recommended.S4.3-2,S4.3-20-S4.3-25. Included from recommendations in the 2018 Cholesterol Clinical Practice Guidelines.S4.3-1
        False: Not applicable to this patient
    citations: 
      - 'In patients 20 to 75 years of age with an LDL-C level of 190 mg/dL (≥4.9 mmol/L) or higher, maximally tolerated statin therapy is recommended.S4.3-2,S4.3-20–S4.3-25. Included from recommendations in the 2018 Cholesterol Clinical Practice Guidelines.S4.3-1'
      - 'Statin therapy is first-line treatment for primary prevention of ASCVD in patients with elevated low-density lipoprotein cholesterol levels (≥190 mg/dL), those with diabetes mellitus, who are 40 to 75 years of age, and those determined to be at sufficient ASCVD risk after a clinician–patient risk discussion.'
      - 'LDL-C ≥190 mg/dL (≥4.9 mmol/L). No risk assessment; High intensity statin (Class I).'
    level_of_evidence: B-R
    class_of_recommendation: I

    
  - id: based_on_dm_and_riskfactors
    title: Recommendation based on the diagnosis of diabetes mellitus with multiple risk factors
    category: medication 
    expression: $has_diabetes is True and $ascvd_risk_enhancing_factors > 3
    narrative:
      patient:
        True: People similar to you, with a diagnosis of __diabetes mellitus__ with multiple risk factors ($ascvd_risk_enhancing_factors), __have benefitted from a statin medication__ to control blood cholesterol.
      provider:
       True: |
          This patient has T2 diabetes mellitus, with $ascvd_risk_enhancing_factors ASCVD risk-enhancing factor(s) in record.

          In patients with diabetes mellitus who have multiple ASCVD risk factors, it is reasonable to prescribe high-intensity statin therapy with the aim to reduce LDL-C by 50% or more.
    citations: 
      - In adults with diabetes mellitus who have multiple ASCVD risk factors, it is reasonable to prescribe high-intensity statin therapy with the aim to reduce LDL-C levels by 50% or more.S4.3-2,S4.3-7. Included from recommendations in the 2018 Cholesterol Clinical Practice Guidelines.S4.3-1
    level_of_evidence: B-R
    class_of_recommendation: IIa

  - id: based_on_dm
    title: High risk diagnosis- Diabetes Mellitus
    expression: $has_diabetes is True
    category: medication 
    narrative:
      patient:
        True: You have a diagnosis of diabetes mellitus. People similar to you, aged $Age years with a diagnosis of diabetes mellitus, __have benefitted from a statin medication__ to control blood cholesterol.
        False: There is no diagnosis of type 2 diabetes mellitus
      provider:
        True: There is a diagnosis of type 2 diabetes mellitus. The patient meets the criteria for initiating statin therapy for the primary prevention of ASCVD.
        False: There is no diagnosis of type 2 diabetes mellitus. 
    citations:
      - 'In adults 40 to 75 years of age with diabetes, regardless of estimated 10-year ASCVD risk, moderate-intensity statin therapy is indicated.S4.3-11–S4.3-19. Included from recommendations in the 2018 Cholesterol Clinical Practice Guidelines.S4.3-1'
    level_of_evidence: A
    class_of_recommendation: IIb

  - id: based_on_lowrisk
    title: Low risk
    category: medication
    expression: $low_riskscore is True
    narrative:
      patient:
        True: ACC/AHA classifies your ten-year score __$ascvd_ten_year_risk_score__ as __low risk__ based on your lab tests and health data, ACC/AHA do not make recommendations for a medication to control blood cholesterol at this stage.
    # level_of_evidence: Some
    class_of_recommendation: IIb


  - id: based_on_borderlinerisk_riskfactors
    title: Borderline risk with risk-enhancing factors
    category: medication
    expression: $borderline_risk is True and $has_any_risk_enhancer is True
    narrative:
      patient:
        True: |
          Your ten-year risk score ($ascvd_ten_year_risk_score) is in the borderline category (5% to <7.5%).
          You have risk-enhancing factors that may justify consideration of moderate-intensity statin therapy.
          Discuss with your healthcare provider about the potential benefits of statin therapy.
      provider:
        True: |
          Patient's 10-year ASCVD risk is borderline ($ascvd_ten_year_risk_score%).
          Risk-enhancing factors present: $ascvd_risk_enhancing_factors factor(s).
          Per 2019 ACC/AHA guidelines, presence of risk-enhancing factors may justify initiation of moderate-intensity statin therapy (Class IIb).
        False: Not applicable to this patient
    citations:
      - 'In patients at borderline risk (5% to <7.5% 10-year ASCVD risk), in risk discussion, the presence of risk-enhancing factors may justify initiation of moderate-intensity statin therapy. (2019 ACC/AHA, Class IIb, LOE B-R)'
      - 'In adults at borderline risk or intermediate risk, it is reasonable to use additional risk-enhancing factors to guide decisions about preventive interventions (eg, statin therapy).'
    class_of_recommendation: IIb
    level_of_evidence: B-R

  - id: based_on_intermediaterisk
    title: Intermediate risk - Statin therapy recommended
    category: medication
    expression: $intermediate_risk is True and $has_diabetes is False
    narrative:
      patient:
        True: |
          Your ten-year risk score ($ascvd_ten_year_risk_score) is in the intermediate category (≥7.5% to <20%).
          Statin therapy reduces risk of ASCVD. If you and your provider decide on statin therapy, a moderate-intensity statin is recommended.
        False: Not applicable
      provider:
        True: |
          Patient's 10-year ASCVD risk is intermediate ($ascvd_ten_year_risk_score%).
          Per 2019 ACC/AHA: Statin therapy reduces ASCVD risk. If decision made for statin, moderate-intensity statin recommended (Class I, LOE A).
          Target: LDL-C reduction of 30% or more.
        False: Not applicable
    citations:
      - 'In adults at intermediate risk (≥7.5% to <20% 10-year ASCVD risk), statin therapy reduces risk of ASCVD. If a decision is made for statin therapy, a moderate-intensity statin should be recommended. (2019 ACC/AHA, Class I, LOE A)'
      - 'In intermediate risk patients, LDL-C levels should be reduced by 30% or more. (2019 ACC/AHA)'
    class_of_recommendation: I
    level_of_evidence: A

  - id: based_on_intermediaterisk_with_enhancers
    title: Intermediate risk with risk-enhancing factors - Favor statin
    category: medication
    expression: $intermediate_risk is True and $has_diabetes is False and $has_any_risk_enhancer is True
    narrative:
      patient:
