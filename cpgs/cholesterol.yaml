CPG:
  title: "2019 Primary Prevention of atherosclerotic cardiovascular disease by managing blood cholesterol"
  identifier: 2019AccPrimaryPreventionASCVD
  publisher: 'American College of Cardiology and American Heart Association'
  uri: https://www.ahajournals.org/doi/pdf/10.1161/CIR.0000000000000678
  doi: 10.1161/CIR.0000000000000678
  parent_cpg_doi: ''
  type: [preventative]
  revision: 1.0
  revision_date: 2024-01-3
  rendering_template_path: 'cholesterol_templates/'
  functions_module_name: ascvd_risk_scores
  description: >
      Recommendations made by the USPSTF are independent of the U.S. government. They should not be construed as an official position of the Agency for Healthcare Research and Quality or the U.S. Department of Health and Human Services.


define: &ldl_code ["13457-7", "18262-6", "2089-1"]
define: &tg_code ["2571-8", "3043-7"]
define: &hdl_code ["2085-9"]


variables:
#--------------------------------------------------------
    #demographic_data
    - id: Age
      code:
        concord: ['Age']

    - id: Gender
      code:
        concord: ['Gender']

    - id: Ethnicity     
      code:
        concord: ['Ethnicity']

#--------------------------------------------------------
    # Laboratory tests
    - id: LDL
      title: LDL
      user_attestable: False
      code:
       loinc: *ldl_code
      validator:
        plausible: '$value > 40'
        panel: '$Chol - $HDL >= $value'
      narrative:
        patient: 
          HasValue: Your LDL results are $self.values
          NoValue: Not found in record
        provider: 
          HasValue: 'Values $self.values'
          NoValue: Not found

    - id: HDL
      title: High density lipoprotein
      user_attestable: False
      code: 
        loinc: *hdl_code

    - id: triglycerides
      title: Triglycerides
      user_attestable: False 
      code: 
       loinc: *tg_code
  
    - id: Chol
      title: Total Cholesterol
      user_attestable: False
      validator: 
        plausible: '$value > 129 and $value < 321'
      code: 
        loinc: ["2093-3"] 

    - id: ApoB
      title: Apo Lipoprotein B
      user_attestable: False
      required: False 
      code: 
        loinc: ["1884-6"]

    - id: HbA_one_c
      title: HBA1c
      user_attestable: False
      required: False
      code: 
        loinc: ["4548-4"]

    - id: glu
      title: Blood glucose
      user_attestable: False
      required: False
      code:
        loinc: ["2345-7", "2339-0"]


#--------------------------------------------------------
    # VITAL SIGNS
    - id: bloodpressure
      title: Blood Pressure
      user_attestable: False
      code:
        loinc: ["55284-4"]
      llm_prompt: |
        What is the patient's blood pressure?
        Look for: blood pressure, BP, systolic/diastolic, mmHg.
        Return: systolic and diastolic values (e.g., 130/80), or null if not mentioned.


#--------------------------------------------------------
    # DIAGNOSIS/CONDITIONS
    - id: diabetesMellitus
      user_attestable: True
      code:
        snomed: ["44054006"]
      llm_prompt: |
        Does the patient have diabetes mellitus (Type 1 or Type 2)?
        Look for: diabetes, DM, Type 1 diabetes, Type 2 diabetes, T1DM, T2DM, diabetic,
        HbA1c elevated, on insulin for diabetes, on metformin.
        Exclude: pre-diabetes alone, gestational diabetes (unless developed into DM).
        Return: true if diabetes diagnosed, false if explicitly denied, null if not mentioned.
      narrative:
        patient:
          True: Condition Type 2 Diabetes Mellitus recorded $self.date. Self-Attested|EHR
        provider:
          True: |
            __Type 2 Diabetes Mellitus__
            Source: Self-Attested | Hospital Name
            Date: $self.date

    - id: htn
      title: Hypertension
      code:
        snomed: ["38341003"]
      llm_prompt: |
        Does the patient have hypertension (high blood pressure)?
        Look for: hypertension, HTN, high blood pressure, elevated BP, on antihypertensive medications.
        Return: true if hypertension diagnosed, false if explicitly denied, null if not mentioned.

    - id: is_smoker
      title: Tobacco smoking status
      code:
        loinc: ["72166-2"]
      llm_prompt: |
        What is the patient's smoking status?
        Look for: current smoker, former smoker, never smoker, tobacco use, cigarettes, pack-years.
        Return: true if current or former smoker, false if never smoked, null if not mentioned.



#--------------------------------------------------------
    # Medications
    - id: med_for_htn
      title: Medication for Hypertension
      reconcile: True
      code:
        rxnorm: ["104375", "104376", "104377", "104378", "206771", "213482", "206764", "206765", "206766", "207965", "823971", "823982", "823986", "1806890", "197884", "197885", "197886", "197887", "205326", "311353", "311354", "314076", "314077", "1806884"]
      llm_prompt: |
        Is the patient taking any medication for high blood pressure (hypertension)?
        Look for: antihypertensive, blood pressure medication, lisinopril, amlodipine, losartan,
        hydrochlorothiazide, metoprolol, atenolol, carvedilol, valsartan, olmesartan, ACE inhibitor, ARB, beta-blocker, calcium channel blocker, diuretic for BP.
        Return: true if on antihypertensive medication, false if not, null if not mentioned.

    - id: med_statins
      title: Statin Medications
      reconcile: True
      code:
        rxnorm: ["262095", "617314", "617318", "617320", "750199", "750203", "750207", "750211", "750215", "750227", "750231", "750235", "750239", "259255", "404011", "404013", "597967", "597971", "597974", "597977", "597980", "597984", "597987", "597990", "597993", "617310", "617311", "617312", "2167563", "2167567", "2167571", "2167575", "859421", "859426", "859749", "859753", "2536060", "2536062", "2536064", "2536066", "2167557", "2167565", "2167569", "2167573", "2535745", "2535747", "2535749", "2535750", "859419", "859424", "859747", "859751", "206257", "206258", "884383", "997006", "997007", "197903", "197904", "197905", "359731", "433849", "582041", "582042", "582043", "729605", "359732", "904668", "904664", "904460", "904469", "904477", "904483", "904458", "904467", "904475", "904481", "861646", "861650", "861654", "2001260", "2001264", "2001268", "861643", "861648", "861652", "2001254", "2001262", "2001266", "1944262", "1944266", "104490", "104491", "152923", "208220", "213319", "1245420", "1245430", "1245441", "1245449", "1944264", "198211", "200345", "312961", "314231", "476345", "476349", "476350", "476351", "757702", "757703", "757704", "757705", "761907", "761909", "762970", "312962", "1790679", "103918", "103919", "687048", "310404", "310405", "360507","316672","1422096","859751","197903","904467","1422086","597980","259255","83367","36567"]
      llm_prompt: |
        Is the patient taking a statin medication for cholesterol?
        Look for: statin, atorvastatin (Lipitor), rosuvastatin (Crestor), simvastatin (Zocor),
        pravastatin (Pravachol), lovastatin (Mevacor), pitavastatin (Livalo), fluvastatin (Lescol).
        Return: true if on statin medication, false if not, null if not mentioned.

    - id: med_nonstatins_chol
      title: Medications to lower blood cholesterol (non-Statins)
      reconcile: True
      code: 
        rxnorm: ["352304", "2283236", "349556", "2283230", "540281", "544518", "578797", "578799", "583096", "1442165", "1442170", "702055", "702169", "763250", "763252", "828377", "828381", "860884", "860888", "141916", "200311", "310288", "310289", "349287", "351133", "389191", "477560", "477562", "483425", "483427", "483429", "577031", "616853", "616852", "749802", "749804", "828373", "828379", "860880", "860886", "1442163", "1442168", "205751", "315106", "310459", "433853", "199700", "848949", "1801280", "848951", "848943", "1801279", "1048447", "1048452", "1048445", "1048450", "866907", "866912", "866910", "866900", "866905", "1102207", "1102202", "1087302", "1087623", "1102206", "1119573", "207662", "211684", "311944", "876861", "876866", "212579", "260852", "647346", "1098135", "1098142", "1098144", "1428828", "1314672", "2121691", "1088779", "2001472", "2001474", "2001480", "2001492", "1098134", "1098141", "1098143", "198024", "198759", "198760", "199143", "200015", "243782", "247747", "311951", "311955", "311959", "311960", "311963", "314131", "391943", "796544", "848987", "881376", "1539267", "2001486", "1102196", "1102201", "283092", "311948", "891522", "1314666", "1119569", "1364854", "1364855", "1235389", "1241896", "1087298", "876858", "876863", "1234482", "1659161", "1659167", "1659179", "1659183", "1659156", "1659165", "1659177", "1659182", "1665900", "1665906", "1801322", "1665895", "1665904", "1801319", "352304", "1245420", "1245430", "1245441", "1245449", "2536060", "2536062", "2536064", "2536066", "2283236", "349556", "476345", "476349", "476350", "476351", "2535745", "2535747", "2535749", "2535750", "2283230"]


    #--------------------------------------------------------
    #Riskfactor variables

    #1. Peristantly Elevated Triglycerides
    - id: elevated_tg
      title: Elevated Triglycerides
      user_attestable: False
      required: False
      code:
        loinc: *tg_code
      filter: 
        expression: ' > 175'
      narrative:
        patient:
          True: 'You have elevated triglycerides (175 mg/dL): $values'
          False: 'There are no tests with triglycerides over 175 in your data ($values)'
          None: Triglyceride tests were __not__ found in your data
        provider:
          True: 'Triglyceride is elevated in this patient: $values'
      


   
      

  #--------------------------------------------------------
  #Risk factor variables
  #All are optional and user attestable
    - id: Psoriasis
      code:
        snomed: ["9014002"]
      required: False
      llm_prompt: |
        Does the patient have psoriasis?
        Look for: psoriasis, psoriatic, plaque psoriasis, guttate psoriasis.
        Return: true if psoriasis present, false if denied, null if not mentioned.

    - id: ckd
      title: Chronic kidney disease
      required: False
      code:
        snomed: ["709044004"]
      llm_prompt: |
        Does the patient have chronic kidney disease (CKD)?
        Look for: CKD, chronic kidney disease, renal insufficiency, kidney disease, elevated creatinine,
        reduced GFR, eGFR <60, on dialysis.
        Return: true if CKD present, false if denied, null if not mentioned.

    - id: RA
      title: Rheumatoid arthritis
      required: False
      code:
        snomed: ["69896004"]
      llm_prompt: |
        Does the patient have rheumatoid arthritis?
        Look for: rheumatoid arthritis, RA, on methotrexate for arthritis, DMARDs for arthritis.
        Exclude: osteoarthritis (OA), degenerative joint disease.
        Return: true if RA present, false if denied, null if not mentioned.

    - id: Lupus
      title: Systemic lupus erythematosus
      required: False
      code:
        snomed: ["55464009"]
      llm_prompt: |
        Does the patient have systemic lupus erythematosus (SLE)?
        Look for: lupus, SLE, systemic lupus, on hydroxychloroquine for lupus.
        Return: true if lupus present, false if denied, null if not mentioned.

    - id: HIV
      title: HIV/AIDS
      required: False
      code:
        snomed: ["86406008"]
      llm_prompt: |
        Does the patient have HIV infection or AIDS?
        Look for: HIV positive, HIV+, AIDS, on antiretroviral therapy (ART), HAART.
        Return: true if HIV positive, false if HIV negative, null if not mentioned.

  #FEMALE RISK FACTOR
    - id: Preeclampsia
      title: Preeclampsia
      code:
        snomed: ["105651000119100", "398254007", "48194001"]
      required: False
      llm_prompt: |
        Does the patient have a history of preeclampsia?
        Look for: preeclampsia, pre-eclampsia, toxemia of pregnancy, pregnancy-induced hypertension
        with proteinuria, HELLP syndrome.
        Return: true if history of preeclampsia, false if denied, null if not mentioned.

    - id: PrematureMenopause
      title: Premature menopause
      required: False
      code:
        snomed: ["373717006"]
      llm_prompt: |
        Does the patient have premature menopause (before age 40)?
        Look for: premature menopause, early menopause, primary ovarian insufficiency,
        premature ovarian failure, menopause before age 40.
        Return: true if premature menopause present, false if denied, null if not mentioned.

  #FAMILYHISTORY
    - id: FamilyHxPrematureASCVD
      title: Family history of premature ASCVD
      required: False
      llm_prompt: |
        Does the patient have a family history of premature atherosclerotic cardiovascular disease?
        Look for: family history of heart attack, stroke, or coronary artery disease in first-degree
        relatives (parents, siblings) before age 55 in men or 65 in women.
        Return: true if family history present, false if explicitly denied, null if not mentioned.

  #SouthAsian
    - id: sa_ancestry
      title: South asian ancestry
      required: False
      type: boolean
      llm_prompt: |
        Is the patient of South Asian ancestry?
        Look for: South Asian, Indian, Pakistani, Bangladeshi, Sri Lankan, Nepali heritage.
        Return: true if South Asian ancestry, false if different ancestry stated, null if not mentioned.


  #Other riskfactors


    - id: hsCRP
      title: HsCRP test
      user_attestable: False
      required: False
      code:
        loinc: ["30522-7"]
      llm_prompt: |
        What is the patient's high-sensitivity C-reactive protein (hs-CRP) level?
        Look for: hs-CRP, hsCRP, high-sensitivity CRP, C-reactive protein.
        Return: numeric value in mg/L, or null if not mentioned.

    - id: Lpa
      title: Lipoprotein(a)
      user_attestable: False
      required: False
      code:
        loinc: ["10835-7", "43583-4"]
      llm_prompt: |
        What is the patient's Lipoprotein(a) [Lp(a)] level?
        Look for: Lp(a), lipoprotein a, lipoprotein little a.
        Note: Elevated is ≥50 mg/dL or ≥125 nmol/L.
        Return: numeric value, or null if not mentioned.

    - id: ABI
      title: Ankle-brachial index
      user_attestable: False
      required: False
      code:
        loinc: ["39016-1"]
      llm_prompt: |
        What is the patient's ankle-brachial index (ABI)?
        Look for: ABI, ankle-brachial index, peripheral arterial disease screening.
        Note: ABI <0.9 indicates peripheral arterial disease and is a risk enhancer.
        Return: numeric value, or null if not mentioned.

    - id: waist_circumference
      title: Waist circumference
      user_attestable: True
      required: False
      code:
        loinc: ["56086-2"]
      llm_prompt: |
        What is the patient's waist circumference?
        Look for: waist circumference, abdominal circumference, waist measurement.
        Note: Elevated is ≥40 inches (102 cm) in men, ≥35 inches (88 cm) in women.
        Return: numeric value in inches or cm, or null if not mentioned.

      #2. Peristantly Erevated LDL
    - id: elevated_LDL_list
      user_attestable: False
      required: False
      code:
        loinc: *ldl_code
      filter:
        expression: ' > 160'
      narrative:
        patient:
          True: 'Tests with LDL over 160: $values'
          False: 'There are no tests with results over 160 in your data ($all_values)'
          None: No LDL tests were found in your data


#-Check eligibility.
#-assume all variables already listed above
#-evaluate using expressions and healthcontext
eligibility:

    - id: age_range
      title: Applicable for individuals between 40 and 75 years.
      expression: $Age > 39.5 and $Age < 76



assessments:

    - id: persistant_tg
      title: Persistantly elevated triglycerides
      expression: $elevated_tg.count > 2 if $triglycerides.count > 2 else None
      required: False
      description: Persistently elevated triglycerides (175 mg/dL or greater on three or more occasions)
      reference: 'Persistently elevated primary hypertriglyceridemia is when triglyceride is ≥175 mg/dL, nonfasting) and with optimally 3 determinations.'
      narrative: 
        patient:
          True: 'You have high Triglyceride in atleast 3 tests $elevated_tg.values'
          False: 'You do not have high Triglycerides in atleast 3 ocasions $triglycerides.values'
          None: 'Not enough data. Need atleast 3 tests to determine risk $triglycerides.count'     


    # simple_eval
    - id: lowHDL
      title: Low HDL
      required: False
      expression: '($HDL < 40) if ($Gender == "http://snomed.info/sct|248153007") else ($HDL < 50)'
      reference: 'low HDL-C: <40 mg/dL in men; <50 mg/dL in women'

    - id: elevated_glucose
      title: Elevated glucose
      required: False
      expression: '$glu > 160'

    - id: Race_Is_Black_AfricanAmerican
      expression: '$Ethnicity == "urn:oid:2.16.840.1.113883.6.238|2058-6" or $Ethnicity == "urn:oid:2.16.840.1.113883.6.238|2060-2"'

    - id: Elevated_hsCRP
      title: Is hsCRP elevated?
      required: False
      expression: $hsCRP > 1.99
      narrative:
        patient:
          NoValue: Could not ascertain value for elevated hsCRP
          False: hsCRP is not elevated
          True: Your hsCRP is elevated $self.value (more than 1.99 mg/dL)
      

    - id: elevated_apoB
      title: Elevated apolipoprotein B
      required: False
      expression: $ApoB >= 130
      reference: 'Elevated apoB (≥130 mg/dL): A relative indication for its measurement would be triglyceride ≥200 mg/dL. A level ≥130 mg/dL corresponds to an LDL-C >160 mg/dL and constitutes a risk-enhancing factor per 2019 ACC/AHA Table 3.'
      narrative:
        patient:
          True: Your apolipoprotein B level is elevated (≥130 mg/dL), which is a risk-enhancing factor.
          NoValue: ApoB values could not found in your data

    - id: elevated_Lpa
      title: Elevated Lipoprotein(a)
      required: False
      expression: $Lpa >= 50
      reference: 'Elevated Lp(a) ≥50 mg/dL or ≥125 nmol/L constitutes a risk-enhancing factor, especially in those with family history of premature ASCVD per 2019 ACC/AHA Table 3.'
      narrative:
        patient:
          True: Your Lipoprotein(a) level is elevated (≥50 mg/dL), which is a risk-enhancing factor.
          NoValue: Lipoprotein(a) was not measured.

    - id: low_ABI
      title: Low ankle-brachial index
      required: False
      expression: $ABI < 0.9
      reference: 'ABI <0.9 indicates peripheral arterial disease and constitutes a risk-enhancing factor per 2019 ACC/AHA Table 3.'
      narrative:
        patient:
          True: Your ankle-brachial index is low (<0.9), indicating peripheral arterial disease, which is a risk-enhancing factor.
          NoValue: Ankle-brachial index was not measured.

    - id: persistant_Elevated_LDL
      title: Persistantly elevated LDL
      description: LDL is elevated at three or more occasions
      expression: $elevated_LDL_list.count > 2 if $LDL.count > 2 else None
      required: False
      reference: 'LDL-cholesterol is persistantly elevated when it is over 160 mg/dL in atleast 3 occasions.'
      narrative: 
        patient:
          True: 'Your LDL is elevated in atleast 3 occasions: $values'
          False: 'You do not have high LDL in atleast 3 occasions $values'
          NoValue: 'Not enough data. Need atleast 3 tests to determine risk $LDL.count' 

    #1._RR_ChronicConditions (per Table 3: psoriasis, RA, lupus, HIV/AIDS)
    - id: chronicConditions
      title: Chronic inflammatory conditions
      expression: $RA is True or $Psoriasis is True or $Lupus is True or $HIV is True or $ckd is True
      required: False
      reference: 'Chronic inflammatory conditions (psoriasis, RA, lupus, or HIV/AIDS) and CKD are risk-enhancing factors per 2019 ACC/AHA Table 3.'
    #2._RR_Female risk enhancing factors
    - id: Femaleriskfactors
      title: Female-specific risk-enhancing factors
      expression: ($Preeclampsia + $PrematureMenopause) > 1
      required: False


    #3._Metabolic risk factors (Table 3: increased waist, elevated TG >150, elevated BP, elevated glucose, low HDL)
    - id: metabolic_syndrome
      title: Metabolic syndrome
      user_attestable: False
      required: False
      expression: |
        (1 if $lowHDL is True else 0) + (1 if $elevated_glucose is True else 0) + (1 if $triglycerides > 150 else 0) + (1 if $htn is True else 0) >= 3
      code:
        concord: ['riskfactors.metabolicsyndrome']
      reference: 'Metabolic syndrome (increased waist circumference, elevated triglycerides >150 mg/dL, elevated BP, elevated glucose, low HDL-C); a tally of 3 makes the diagnosis per 2019 ACC/AHA Table 3.'
      narrative:
        patient:
          True: You have metabolic syndrome, which is a risk-enhancing factor for cardiovascular disease.
          False: You do not meet criteria for metabolic syndrome based on available data.
    #FINAL_RR - Complete list per 2019 ACC/AHA Table 3
    - id: ascvd_risk_enhancing_factors
      title: ASCVD risk-enhancing factors
      expression: |
        (1 if $FamilyHxPrematureASCVD is True else 0) +
        (1 if $persistant_Elevated_LDL is True else 0) +
        (1 if $metabolic_syndrome is True else 0) +
        (1 if $chronicConditions is True else 0) +
        (1 if $Femaleriskfactors is True else 0) +
        (1 if $sa_ancestry is True else 0) +
        (1 if $persistant_tg is True else 0) +
        (1 if $Elevated_hsCRP is True else 0) +
        (1 if $elevated_Lpa is True else 0) +
        (1 if $elevated_apoB is True else 0) +
        (1 if $low_ABI is True else 0)
      required: False
      reference: 'Risk-enhancing factors per 2019 ACC/AHA Table 3: Family history of premature ASCVD, LDL-C 160-189, metabolic syndrome, CKD, chronic inflammatory conditions, pregnancy complications, South Asian ancestry, elevated TG, hs-CRP ≥2, Lp(a) ≥50, apoB ≥130, ABI <0.9'
      narrative:
        patient:
          False: No risk-enhancing factors were identified in your data.
          True: |
            __$self.value__ risk-enhancing factor(s) found in your data.
            ACC/AHA guidance suggests that these factors can favor initiation or intensification of statin therapy for borderline or intermediate risk patients.
        provider:
          False: No risk-enhancing factors identified.
          True: |
            __$self.value__ risk-enhancing factor(s) identified per 2019 ACC/AHA Table 3.
            In borderline (5-7.5%) or intermediate (7.5-20%) risk patients, risk-enhancing factors favor initiation or intensification of statin therapy.

    - id: has_any_risk_enhancer
      title: Has any risk-enhancing factor
      expression: $ascvd_risk_enhancing_factors >= 1
      required: False
      narrative:
        patient:
          True: You have at least one risk-enhancing factor that may favor statin therapy.
          False: No risk-enhancing factors identified.
            

    # ------------------------------------------------------------------------------------
    - id: ascvd_ten_year_risk_score
      title: ASCVD Ten Year risk score
      description: The ten year risk score estimates the likelihood of an individual having a cardiovascular event like a heart attack, stroke in the next 10 years.
      function: tenyearriskscore
      narrative:
        provider:
          HasValue: |
              ASCVD Ten Year Risk Score: $self.value

              Calculated from:

                - Demographics: $Age years, Gender: $Gender, Ethnicity: $Ethnicity
                - Vitals: Blood Pressure: $bloodpressure
                - Choleseterol: $Chol
                - HDL: $HDL
                - Have diabetes: $diabetesMellitus
                - History of smoking: $is_smoker
                - Taking Hypertension medications: $med_for_htn
        patient:
          HasValue: |
            
            ### Your ten-year heart disease risk score is: $self.value

            This score was calculated from your medical history and lab results.

            - The  __$self.value__  score is an estimation of your chance of having a heart attack or stroke or other cardiovascular event __within the next ten years__.
            - __x out of 100__ individuals _like you_ would be predicted to have a heart attack, stroke or other cardiovascular event within the next ten years.
            - __x out of 100__ individuals _like you_ would be predicted to __not__ have a heart attack, stroke or other cardiovascular event within the next ten years.

            This score was calculated from the following data:
            
              - Your demographics: $Age years, Gender: $Gender, ethnicity: $Ethnicity (Is race/ethnicity AfricanAmerican or Black: $Race_Is_Black_AfricanAmerican)
              - Vitals: Blood Pressure: $bloodpressure
              - Choleseterol: $Chol
              - HDL: $HDL
              - Have diabetes: $diabetesMellitus
              - History of smoking?: $is_smoker
              - Taking Hypertension medications?: $med_for_htn

    - id: ascvd_optimal_risk_score
      title: Optimal Ten Year ASCVD risk score
      function: optimal_tenyearriskscore
      narrative: 
        patient:
          True: optimal_risk_score_interpreter.md
        patient:
          HasValue: |
            # Under optimal lab test results and history, your ten-year score could be $self.value

    # ------------------------------------------------------------------------------------
      
    - id: ldl_over_190
      title: LDL is 190 mg/dL or greater
      expression: $LDL >= 190
      narrative:
        patient:
          True: |
            Your LDL-Cholesterol is __$LDL mg/dL recorded $LDL.date__.
            A value of __190 mg/dL or more__ is a high risk state that increases the risk of developing heart attack or stroke or other cardiovascular event.
          None: Could not be determined.
          False: Most recent LDL in your record is $LDL mg/dL record $LDL.date
        provider:
          True: Most recent $LDL recorded $LDL.date
          False: Most recent is below 190 ($LDL $LDL.date)
      reference: 'LDL-cholesterol ≥190 mg/dL (≥4.9 mmol/L) is a high risk factor for developing atherosclerotic cardiovascular disease. Per 2019 ACC/AHA guidelines.'

    - id: has_diabetes
