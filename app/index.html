<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConcordCore API Explorer</title>
    <style>
        :root {
            --bg: #f8f9fa;
            --surface: #ffffff;
            --border: #e2e5e9;
            --text: #1a1d21;
            --text-dim: #6b7280;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --get: #059669;
            --post: #d97706;
            --mono: 'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace;
            --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            --radius: 6px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--sans); background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }

        header {
            background: var(--text);
            color: #fff;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        header h1 { font-size: 1rem; font-weight: 600; letter-spacing: -0.01em; }
        header span { font-size: 0.8rem; opacity: 0.5; }

        .layout { display: flex; flex: 1; overflow: hidden; }

        /* Sidebar */
        .sidebar {
            width: 280px;
            border-right: 1px solid var(--border);
            background: var(--surface);
            overflow-y: auto;
            flex-shrink: 0;
            padding: 12px;
        }
        .sidebar h2 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin: 16px 0 8px 8px; }
        .sidebar h2:first-child { margin-top: 4px; }

        .endpoint-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 8px 10px;
            border: none;
            background: none;
            border-radius: var(--radius);
            cursor: pointer;
            text-align: left;
            font-size: 0.82rem;
            font-family: var(--mono);
            color: var(--text);
            transition: background 0.15s;
        }
        .endpoint-btn:hover { background: var(--bg); }
        .endpoint-btn.active { background: #eef2ff; color: var(--accent); }

        .method-badge {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 3px;
            text-transform: uppercase;
            flex-shrink: 0;
            min-width: 36px;
            text-align: center;
        }
        .method-badge.get { background: #d1fae5; color: var(--get); }
        .method-badge.post { background: #fef3c7; color: var(--post); }

        /* Main panel */
        .main { flex: 1; overflow-y: auto; padding: 24px 32px; }

        .endpoint-header { margin-bottom: 20px; }
        .endpoint-header h2 { font-size: 1.1rem; margin-bottom: 4px; }
        .endpoint-header code { font-family: var(--mono); font-size: 0.85rem; color: var(--text-dim); }

        .form-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
        }
        .form-section h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-dim); margin-bottom: 12px; }

        .field { margin-bottom: 12px; }
        .field label { display: block; font-size: 0.8rem; font-weight: 500; margin-bottom: 4px; color: var(--text-dim); }
        .field input, .field textarea, .field select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-family: var(--mono);
            font-size: 0.85rem;
            background: var(--bg);
        }
        .field textarea { min-height: 140px; resize: vertical; }
        .field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(37,99,235,0.1); }

        .send-btn {
            padding: 10px 24px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
        }
        .send-btn:hover { background: var(--accent-hover); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Response */
        .response-section { margin-top: 20px; }
        .response-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .response-header h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-dim); }
        .status-badge { font-size: 0.75rem; font-weight: 600; padding: 2px 8px; border-radius: 3px; }
        .status-badge.ok { background: #d1fae5; color: var(--get); }
        .status-badge.err { background: #fee2e2; color: #dc2626; }
        .timing { font-size: 0.75rem; color: var(--text-dim); }

        pre.response {
            background: #1e293b;
            color: #e2e8f0;
            padding: 16px;
            border-radius: var(--radius);
            overflow-x: auto;
            font-family: var(--mono);
            font-size: 0.8rem;
            line-height: 1.5;
            max-height: 600px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .placeholder {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-dim);
        }
        .placeholder h2 { font-size: 1.2rem; margin-bottom: 8px; color: var(--text); }

        @media (max-width: 768px) {
            .layout { flex-direction: column; }
            .sidebar { width: 100%; max-height: 200px; border-right: none; border-bottom: 1px solid var(--border); }
            .main { padding: 16px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>ConcordCore</h1>
        <span>API Explorer</span>
    </header>

    <div class="layout">
        <nav class="sidebar" id="sidebar"></nav>
        <main class="main" id="main">
            <div class="placeholder">
                <h2>ConcordCore API</h2>
                <p>Select an endpoint from the sidebar to begin.</p>
            </div>
        </main>
    </div>

    <script>
    const ENDPOINTS = [
        {
            group: "Discovery",
            items: [
                {
                    id: "list-cpgs",
                    method: "GET",
                    path: "/api/cpgs",
                    title: "List CPGs",
                    desc: "List all CPGs grouped by category. Filter by variable code: code or system|code",
                    fields: [
                        { name: "code", label: "Code filter (optional, e.g. 18262-6 or http://loinc.org|18262-6)", type: "text", placeholder: "http://loinc.org|18262-6", queryParam: true },
                    ],
                },
                {
                    id: "get-cpg",
                    method: "GET",
                    path: "/api/cpgs/{cpg_id}",
                    title: "CPG Detail",
                    desc: "Full CPG detail: variables, eligibility, assessments, recommendations",
                    fields: [
                        { name: "cpg_id", label: "CPG Identifier", type: "text", placeholder: "2019AccPrimaryPreventionASCVD", pathParam: true },
                    ],
                },
                {
                    id: "list-variables",
                    method: "GET",
                    path: "/api/variables",
                    title: "Variables Index",
                    desc: "Cross-CPG variable index. Optional cpg_ids filter.",
                    fields: [
                        { name: "cpg_ids", label: "CPG IDs (comma-separated, optional)", type: "text", placeholder: "2019AccPrimaryPreventionASCVD,uspstfStatinUse", queryParam: true },
                    ],
                },
            ],
        },
        {
            group: "Evaluation",
            items: [
                {
                    id: "screen",
                    method: "POST",
                    path: "/api/screen",
                    title: "Screen Patient",
                    desc: "Screen patient against all CPGs for eligibility",
                    fields: [
                        { name: "health_data", label: "Health Data (JSON array)", type: "json", default: JSON.stringify([
                            {"variable_id": "Age", "value": 55},
                            {"variable_id": "Sex", "value": "male"},
                            {"variable_id": "LDL", "value": 165},
                            {"variable_id": "HDL", "value": 42},
                            {"variable_id": "Chol", "value": 230},
                            {"variable_id": "diabetesMellitus", "value": 1}
                        ], null, 2)},
                        { name: "persona", label: "Persona", type: "select", options: ["provider", "patient", "guardian"], default: "provider" },
                    ],
                },
                {
                    id: "evaluate",
                    method: "POST",
                    path: "/api/evaluate",
                    title: "Evaluate CPG",
                    desc: "Full single-CPG pipeline: eligibility, sufficiency, assessment, recommendations",
                    fields: [
                        { name: "cpg_id", label: "CPG Identifier", type: "text", placeholder: "2019AccPrimaryPreventionASCVD" },
                        { name: "health_data", label: "Health Data (JSON array)", type: "json", default: JSON.stringify([
                            {"variable_id": "Age", "value": 55},
                            {"variable_id": "Sex", "value": "male"},
                            {"variable_id": "LDL", "value": 165},
                            {"variable_id": "HDL", "value": 42},
                            {"variable_id": "Chol", "value": 230},
                            {"variable_id": "Trig", "value": 180},
                            {"variable_id": "SBP", "value": 140},
                            {"variable_id": "diabetesMellitus", "value": 1},
                            {"variable_id": "htn", "value": 1},
                            {"variable_id": "is_smoker", "value": 1},
                            {"variable_id": "on_statin", "value": 0}
                        ], null, 2)},
                        { name: "persona", label: "Persona", type: "select", options: ["provider", "patient", "guardian"], default: "provider" },
                    ],
                },
                {
                    id: "evaluate-multi",
                    method: "POST",
                    path: "/api/evaluate/multi",
                    title: "Multi-CPG Evaluate",
                    desc: "Parallel multi-CPG evaluation with conflict detection",
                    fields: [
                        { name: "cpg_ids", label: "CPG IDs (JSON array)", type: "json", default: JSON.stringify(["2019AccPrimaryPreventionASCVD", "uspstfStatinUse"], null, 2) },
                        { name: "parallel", label: "Parallel", type: "select", options: ["true", "false"], default: "true" },
                        { name: "health_data", label: "Health Data (JSON array)", type: "json", default: JSON.stringify([
                            {"variable_id": "Age", "value": 55},
                            {"variable_id": "Sex", "value": "male"},
                            {"variable_id": "LDL", "value": 165},
                            {"variable_id": "HDL", "value": 42},
                            {"variable_id": "Chol", "value": 230},
                            {"variable_id": "Trig", "value": 180},
                            {"variable_id": "SBP", "value": 140},
                            {"variable_id": "diabetesMellitus", "value": 1},
                            {"variable_id": "htn", "value": 1},
                            {"variable_id": "is_smoker", "value": 1},
                            {"variable_id": "on_statin", "value": 0}
                        ], null, 2)},
                        { name: "persona", label: "Persona", type: "select", options: ["provider", "patient", "guardian"], default: "provider" },
                    ],
                },
                {
                    id: "verify",
                    method: "POST",
                    path: "/api/verify",
                    title: "Verify Reproducibility",
                    desc: "Re-run evaluation and compare hashes for reproducibility",
                    fields: [
                        { name: "cpg_id", label: "CPG Identifier", type: "text", placeholder: "2019AccPrimaryPreventionASCVD" },
                        { name: "verification_record", label: "Verification Record (JSON)", type: "json", default: '{}', placeholder: "Paste from /api/evaluate response" },
                        { name: "health_data", label: "Health Data (JSON array)", type: "json", default: "[]" },
                        { name: "persona", label: "Persona", type: "select", options: ["provider", "patient", "guardian"], default: "provider" },
                    ],
                },
                {
                    id: "fhir",
                    method: "POST",
                    path: "/api/fhir/to-records",
                    title: "FHIR to Records",
                    desc: "Parse FHIR R4 bundle into CPG variable records",
                    fields: [
                        { name: "cpg_id", label: "CPG Identifier", type: "text", placeholder: "2019AccPrimaryPreventionASCVD" },
                        { name: "fhir_bundle", label: "FHIR Bundle (JSON)", type: "json", default: JSON.stringify({"resourceType": "Bundle", "type": "collection", "entry": []}, null, 2) },
                    ],
                },
            ],
        },
    ];

    // Build sidebar
    const sidebar = document.getElementById("sidebar");
    ENDPOINTS.forEach(group => {
        sidebar.innerHTML += `<h2>${group.group}</h2>`;
        group.items.forEach(ep => {
            sidebar.innerHTML += `
                <button class="endpoint-btn" data-id="${ep.id}" onclick="selectEndpoint('${ep.id}')">
                    <span class="method-badge ${ep.method.toLowerCase()}">${ep.method}</span>
                    ${ep.title}
                </button>`;
        });
    });

    function findEndpoint(id) {
        for (const g of ENDPOINTS) {
            for (const ep of g.items) {
                if (ep.id === id) return ep;
            }
        }
        return null;
    }

    function selectEndpoint(id) {
        document.querySelectorAll(".endpoint-btn").forEach(b => b.classList.remove("active"));
        document.querySelector(`[data-id="${id}"]`).classList.add("active");

        const ep = findEndpoint(id);
        const main = document.getElementById("main");

        let fieldsHtml = "";
        ep.fields.forEach(f => {
            if (f.type === "json") {
                fieldsHtml += `
                    <div class="field">
                        <label>${f.label}</label>
                        <textarea id="f-${f.name}" placeholder="${f.placeholder || ''}">${f.default || ''}</textarea>
                    </div>`;
            } else if (f.type === "select") {
                const opts = f.options.map(o => `<option value="${o}" ${o === f.default ? 'selected' : ''}>${o}</option>`).join("");
                fieldsHtml += `
                    <div class="field">
                        <label>${f.label}</label>
                        <select id="f-${f.name}">${opts}</select>
                    </div>`;
            } else {
                fieldsHtml += `
                    <div class="field">
                        <label>${f.label}</label>
                        <input type="text" id="f-${f.name}" placeholder="${f.placeholder || ''}" value="${f.default || ''}">
                    </div>`;
            }
        });

        main.innerHTML = `
            <div class="endpoint-header">
                <h2>${ep.title}</h2>
                <code>${ep.method} ${ep.path}</code>
                <p style="margin-top:6px;font-size:0.85rem;color:var(--text-dim)">${ep.desc}</p>
            </div>
            ${ep.fields.length > 0 ? `
            <div class="form-section">
                <h3>Request</h3>
                ${fieldsHtml}
            </div>` : ''}
            <button class="send-btn" id="send-btn" onclick="sendRequest('${ep.id}')">Send Request</button>
            <div class="response-section" id="response-section" style="display:none">
                <div class="response-header">
                    <h3>Response</h3>
                    <span class="status-badge" id="status-badge"></span>
                    <span class="timing" id="timing"></span>
                </div>
                <pre class="response" id="response-body"></pre>
            </div>`;
    }

    async function sendRequest(id) {
        const ep = findEndpoint(id);
        const btn = document.getElementById("send-btn");
        btn.disabled = true;
        btn.textContent = "Sending...";

        const startTime = performance.now();

        try {
            let url = ep.path;
            let options = { headers: {} };

            if (ep.method === "GET") {
                // Substitute path params
                ep.fields.forEach(f => {
                    if (f.pathParam) {
                        const val = document.getElementById(`f-${f.name}`).value.trim();
                        url = url.replace(`{${f.name}}`, encodeURIComponent(val));
                    }
                    if (f.queryParam) {
                        const val = document.getElementById(`f-${f.name}`).value.trim();
                        if (val) {
                            url += (url.includes("?") ? "&" : "?") + `${f.name}=${encodeURIComponent(val)}`;
                        }
                    }
                });
                options.method = "GET";
            } else {
                options.method = "POST";
                options.headers["Content-Type"] = "application/json";

                const body = {};
                ep.fields.forEach(f => {
                    const el = document.getElementById(`f-${f.name}`);
                    let val = el.value.trim();
                    if (f.type === "json") {
                        try { val = JSON.parse(val); } catch(e) { /* send as-is */ }
                    } else if (f.type === "select") {
                        if (val === "true") val = true;
                        else if (val === "false") val = false;
                    }
                    body[f.name] = val;
                });
                options.body = JSON.stringify(body);
            }

            const resp = await fetch(url, options);
            const elapsed = (performance.now() - startTime).toFixed(0);
            const data = await resp.json();

            showResponse(resp.status, elapsed, data);
        } catch (err) {
            const elapsed = (performance.now() - startTime).toFixed(0);
            showResponse(0, elapsed, { error: err.message });
        } finally {
            btn.disabled = false;
            btn.textContent = "Send Request";
        }
    }

    function showResponse(status, elapsedMs, data) {
        const section = document.getElementById("response-section");
        section.style.display = "block";

        const badge = document.getElementById("status-badge");
        badge.textContent = status || "ERR";
        badge.className = `status-badge ${status >= 200 && status < 300 ? 'ok' : 'err'}`;

        document.getElementById("timing").textContent = `${elapsedMs} ms`;
        document.getElementById("response-body").textContent = JSON.stringify(data, null, 2);
    }
    </script>
</body>
</html>
