# Pre-commit hooks for CPG validation
#
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
#
# Technical Advantage: Every CPG change is validated before commit
# Unlike LLM systems, Concord CPGs can be validated at commit time.

repos:
  # Standard hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-json
      - id: check-merge-conflict

  # Python linting with ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.2.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  # CPG-specific validation
  - repo: local
    hooks:
      # Validate CPG YAML structure
      - id: validate-cpg-yaml
        name: Validate CPG YAML files
        entry: python scripts/validate_cpg_yaml.py
        language: python
        files: ^cpgs/.*\.yaml$
        additional_dependencies: [pyyaml]

      # Run CPG unit tests on push
      - id: cpg-tests
        name: Run CPG tests
        entry: pytest tests/ -v --tb=short -q
        language: system
        pass_filenames: false
        always_run: false
        stages: [pre-push]
        files: ^(cpgs/|core/|variables/|primitives/|tests/)
